name: React CI/CD Pipeline

# Define when this workflow should run
on:
    push:
        branches: [ main, dev ]
    # Trigger on pull requests to main branch
    pull_request:
        branches: [ main, dev ]

    # Allow mannual trigger from GitHub UI
    workflow_dispatch:

#Define environment variables
env:
    VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

#Define jobs that will run
jobs:
    #Job 1: Run tests and build checks
    test-and-build:
        runs-on: ubuntu-latest

        steps:
            # Step 1: Checkout code
            - name: Checkout repository
              uses: actions/checkout@v4

            # Step 2: Set up Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '18'  # Specify the Node.js version
                cache: 'npm'  # Cache npm dependencies

            # Step 3: Install dependencies
            - name: Install dependencies
              run: npm ci
              
            # Step 4: Run linting (if applicable)
            - name: Run ESLint
              run: npm run lint
              continue-on-error: true  # Continue even if linting fails

            # Step 5: Run tests (skip for now since Vite doesn't include test setup by default)
            # - name: Run tests
            #   run: npm test --coverage --watchAll=false

            # Step 6: Build the application
            - name: Build application
              run: npm run build

            # Step 7: Upload build artifacts for deployment job
            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                name: build-files
                path: dist/


    #Job 2: Deploy to Vercel Preview (for pull requests)
    deploy-preview:
        runs-on: ubuntu-latest
        needs: test-and-build
        if: github.event_name == 'pull_request'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '18'
                cache: 'npm'

            - name: Install vercel CLI
              run: npm install --global vercel@latest

            - name: Pull Vercel Environment Information
              run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

            - name: Build Project Artifacts
              run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

            - name: Deploy Preview to Vercel
              id: deploy-preview
              run: echo "preview_url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT

            - name: Comment Preview URL
              uses: actions/github-scripts@v7
              with:
                script: |
                  github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `🚀 Preview deployment ready! \n\n✨ Preview URL: ${{ steps.deploy-preview.outputs.preview_url }}`
                  })

    # Job 3: Deploy to Vercel Production (for main branch)
    deploy-production:
        runs-on: ubuntu-latest
        needs: test-and-build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '18'
                cache: 'npm'

            - name: Install Vercel CLI
              run: npm install --global vercel@latest
            
            - name: Pull Vercel Environment Information
              run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
            
            - name: Build Project Artifacts
              run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
            
            - name: Deploy to Production
              id: deploy-production
              run: echo "production_url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT
            
            - name: Production Deployment Success
              run: |
                echo "🎉 Production deployment successful!"
                echo "🚀 Live URL: ${{ steps.deploy-production.outputs.production_url }}"


