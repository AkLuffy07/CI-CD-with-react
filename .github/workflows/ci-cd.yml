    # Job 4: Code Quality Checks (runs in parallel with test-and-build job)
    code-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '18'
                cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Check code formatting with Prettier (if configured)
            - name: Check code formatting
              run: npx prettier --check . || echo "Prettier not configured, skipping..."
              continue-on-error: true  # Continue even if formatting check fails

            # Run security audit
            - name: Run security audit
              run: npm audit --audit-level=high
              continue-on-error: true  # Continue even if audit fails

            # Check for outdated dependencies
            - name: Check for outdated dependencies
              run: npm outdated
              continue-on-error: true  # Continue even if outdated dependencies are found

    # Job 5: Notification Job
    notify:
        runs-on: ubuntu-latest
        needs: [test-and-build, code-quality]
        if: always()  # Run this job regardless of previous job success/failure

        steps:
            - name: Build Status Summary
              run: |
                if [[ "${{ needs.test-and-build.result }}" == "success"  && "${{ needs.code-quality.result }}" == "success" ]]; then
                    echo "All checks passed! Ready for deployment🎉"
                else
                    echo "❌ Some checks failed. Please review the logs."
                fi